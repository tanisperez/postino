[package]
name = "postino-runner"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
postino-core = { path = "../postino-core" }
postino-script = { path = "../postino-script" }
postino-http = { path = "../postino-http" }
postino-oauth = { path = "../postino-oauth" }
thiserror = { workspace = true }
log = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
# Only for the sample suite test, which loads samples/workspace.
postino-workspace = { path = "../postino-workspace" }
# Only for the test that runs converted Postman scripts.
postino-format = { path = "../postino-format" }
# Enables the test server helper for this crate's own tests, without shipping it in release builds.
postino-http = { path = "../postino-http", features = ["test-support"] }

[lints]
workspace = true
