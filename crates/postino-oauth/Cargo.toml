[package]
name = "postino-oauth"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
postino-core = { path = "../postino-core" }
postino-http = { path = "../postino-http" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
tiny_http = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
# Enables the test server helper for this crate's own tests, without shipping it in release builds.
postino-http = { path = "../postino-http", features = ["test-support"] }

[lints]
workspace = true
