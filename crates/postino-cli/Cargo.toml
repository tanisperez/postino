[package]
name = "postino-cli"
description = "The command line commands of Postino that print and exit instead of opening the window."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

# `AttachConsole`, so the output reaches the terminal from a GUI subsystem binary.
# Already in the tree at this version (async-io, through gpui-base).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[lints]
workspace = true
