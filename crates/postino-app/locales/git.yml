"git.failure.auth_text":
  en: "The remote refused the credentials. Postino uses git's credential helper or SSH agent: check that they work in a terminal."
  es: "El remoto rechazó las credenciales. Postino usa el gestor de credenciales de git o el agente SSH: comprueba que funcionan en un terminal."
  gl: "O remoto rexeitou as credenciais. Postino usa o xestor de credenciais de git ou o axente SSH: comproba que funcionan nun terminal."
  it: "Il remoto ha rifiutato le credenziali. Postino usa il gestore di credenziali di git o l'agente SSH: verifica che funzionino in un terminale."
"git.failure.no_author_text":
