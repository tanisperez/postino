  es: "Git no sabe quién eres. Configura user.name y user.email con git config."
  gl: "Git non sabe quen es. Configura user.name e user.email con git config."
  it: "Git non sa chi sei. Imposta user.name e user.email con git config."
"git.failure.nothing_text":
