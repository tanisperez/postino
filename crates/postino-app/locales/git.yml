  es: "No hay nada preparado para el commit."
  gl: "Non hai nada preparado para o commit."
  it: "Non c'è nulla di preparato per il commit."
"git.failure.conflicts_text":
  en: "Some files have conflicts. Resolve them in an external tool, then commit."
  es: "Algunos archivos tienen conflictos. Resuélvelos con una herramienta externa y luego haz commit."
  gl: "Algúns ficheiros teñen conflitos. Resólveos cunha ferramenta externa e despois fai commit."
  it: "Alcuni file hanno conflitti. Risolvili con uno strumento esterno, poi esegui il commit."
"git.failure.network_text":
  en: "The remote could not be reached. Check the connection and try again."
  es: "No se pudo conectar con el remoto. Comprueba la conexión y vuelve a intentarlo."
  gl: "Non se puido conectar co remoto. Comproba a conexión e volve intentalo."
  it: "Impossibile raggiungere il remoto. Controlla la connessione e riprova."
"git.failure.hook_text":
