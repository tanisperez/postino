"openapi.update.note":
  en: "Changed requests keep their scripts, tests and edited values: only the URL, parameters, headers and an example body that was not edited are updated from the spec. Removed endpoints stay unless checked."
  es: "Las peticiones cambiadas conservan sus scripts, pruebas y valores editados: de la especificación solo se actualizan la URL, los parámetros, las cabeceras y un cuerpo de ejemplo que no se haya editado. Los endpoints eliminados se conservan salvo que se marquen."
  gl: "As peticións cambiadas conservan os seus scripts, probas e valores editados: da especificación só se actualizan o URL, os parámetros, as cabeceiras e un corpo de exemplo que non se editase. Os endpoints eliminados consérvanse agás que se marquen."
  it: "Le richieste modificate mantengono script, test e valori modificati: dalla specifica si aggiornano solo URL, parametri, intestazioni e un corpo di esempio non modificato. Gli endpoint rimossi restano, a meno che non siano selezionati."
