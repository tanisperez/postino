"oauth.redirect_loopback_note":
  en: "A free port is chosen on each sign-in. This is what RFC 8252 recommends; providers such as Google or Microsoft accept it without registering the port."
  es: "Se elige un puerto libre en cada inicio de sesión. Es lo que recomienda RFC 8252; proveedores como Google o Microsoft lo aceptan sin registrar el puerto."
  gl: "Escóllese un porto libre en cada inicio de sesión. É o que recomenda RFC 8252; provedores como Google ou Microsoft acéptano sen rexistrar o porto."
  it: "A ogni accesso si sceglie una porta libera. È quanto raccomanda la RFC 8252; provider come Google o Microsoft lo accettano senza registrare la porta."
"oauth.redirect_fixed_note":
  en: "For providers that require the exact URL, port included. Postino listens on that port while it waits."
  es: "Para proveedores que exigen la URL exacta, puerto incluido. Postino escucha en ese puerto mientras espera."
  gl: "Para provedores que esixen a URL exacta, porto incluído. Postino escoita nese porto mentres agarda."
  it: "Per i provider che richiedono l'URL esatto, porta inclusa. Postino resta in ascolto su quella porta mentre attende."
"oauth.redirect_manual_note":
  en: "When only a web URL is allowed: Postino opens the browser and asks you to paste the URL it ended at, with the code."
  es: "Cuando solo se admite una URL web: Postino abre el navegador y pide pegar la URL a la que acabó redirigiendo, con el código."
  gl: "Cando só se admite unha URL web: Postino abre o navegador e pide pegar a URL á que acabou redirixindo, co código."
  it: "Quando è ammesso solo un URL web: Postino apre il browser e chiede di incollare l'URL di arrivo, con il codice."
