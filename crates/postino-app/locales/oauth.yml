"oauth.empty_text":
  en: "A profile holds the OAuth settings once, and every request that needs it just picks it."
  es: "Un perfil guarda la configuración OAuth una sola vez, y cada petición que la necesita solo lo elige."
  gl: "Un perfil garda a configuración OAuth unha soa vez, e cada petición que a precisa só o escolle."
  it: "Un profilo conserva le impostazioni OAuth una sola volta, e ogni richiesta che ne ha bisogno lo sceglie e basta."
"oauth.create_hint":
  en: "The fields start empty, with examples as placeholders ({{authBaseUrl}}/oauth/token). Use variables for what changes per environment. The Postman, Bruno and OpenAPI imports create profiles on their own."
  es: "Los campos empiezan vacíos, con ejemplos como marcador ({{authBaseUrl}}/oauth/token). Usa variables para lo que cambia por entorno. Las importaciones de Postman, Bruno y OpenAPI crean perfiles por su cuenta."
  gl: "Os campos comezan baleiros, con exemplos como marcador ({{authBaseUrl}}/oauth/token). Usa variables para o que cambia por contorno. As importacións de Postman, Bruno e OpenAPI crean perfís pola súa conta."
  it: "I campi partono vuoti, con esempi come segnaposto ({{authBaseUrl}}/oauth/token). Usa variabili per ciò che cambia per ambiente. Le importazioni di Postman, Bruno e OpenAPI creano i profili da sole."
"oauth.copy_hint":
  en: "The copy keeps every setting of the profile, under the new name."
  es: "La copia conserva todos los ajustes del perfil con el nombre nuevo."
  gl: "A copia conserva todos os axustes do perfil co nome novo."
  it: "La copia conserva tutte le impostazioni del profilo con il nuovo nome."
