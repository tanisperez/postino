[package]
name = "postino-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "postino"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
# Only the tree-sitter grammars the request/response/script editors actually highlight:
# JSON and XML bodies, JavaScript pre/post scripts. "tree-sitter-html" is the closest available
# grammar to XML in this version of gpui-component (there is no dedicated XML grammar), used as a
# readable approximation for `::: body xml`. Both features pull in the base "tree-sitter" feature,
# which bundles the JSON grammar, so it is not listed again here.
gpui-kit = { workspace = true, features = ["tree-sitter-javascript", "tree-sitter-html"] }
dirs = { workspace = true }
dunce = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
log = { workspace = true }
rust-i18n = { workspace = true }
sys-locale = { workspace = true }
icu_decimal = { workspace = true }
icu_locale_core = { workspace = true }
chrono = { workspace = true }
postino-core = { path = "../postino-core" }
postino-format = { path = "../postino-format" }
postino-workspace = { path = "../postino-workspace" }
postino-runner = { path = "../postino-runner" }
postino-script = { path = "../postino-script" }
postino-load = { path = "../postino-load" }
postino-update = { path = "../postino-update" }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile = { workspace = true }
pretty_assertions = { workspace = true }

[lints]
workspace = true
