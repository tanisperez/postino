[package]
name = "postino-load"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
postino-core = { path = "../postino-core" }
postino-runner = { path = "../postino-runner" }
postino-http = { path = "../postino-http" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
postino-script = { path = "../postino-script" }
# Enables the test server helper for this crate's own tests, without shipping it in release builds.
postino-http = { path = "../postino-http", features = ["test-support"] }

[lints]
workspace = true
