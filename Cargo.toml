[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
gpui-kit = "0.6.6"
rquickjs = "0.14"
ureq = "3.4"
serde = "1"
serde_json = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1.26", features = ["v4"] }
base64 = "0.23"
fastrand = "2"
pretty_assertions = "1.4"
tempfile = "3"
tiny_http = "0.12"
dirs = "7"
dunce = "1"
toml = "0.8"

[workspace.lints.clippy]
all = "warn"
unwrap_used = "warn"
expect_used = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
