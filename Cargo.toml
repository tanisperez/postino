[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.2.0"
publish = false
license = "Apache-2.0"
authors = ["Estanislao Pérez Nartallo <tanisperez@gmail.com>"]

[workspace.dependencies]
gpui-kit = "0.8.0"
# The design system and standard components shared with Vano and Nastro. Same gpui-kit pin.
telaio-ui = { git = "https://github.com/tanisperez/telaio", tag = "v0.4.0" }
telaio-update = { git = "https://github.com/tanisperez/telaio", tag = "v0.4.0" }
# The application shell: logging, command line pieces, language, numbers, paths, window bootstrap.
telaio-app = { git = "https://github.com/tanisperez/telaio", tag = "v0.4.0" }
rquickjs = "0.14"
ureq = "3.4"
serde = "1"
serde_json = "1"
thiserror = "2"
anyhow = "1"
lsp-types = "0.97"
uuid = { version = "1.26", features = ["v4"] }
base64 = "0.23"
fastrand = "2"
pretty_assertions = "1.4"
tempfile = "3"
tiny_http = "0.12"
dirs = "7"
dunce = "1"
toml = "0.8"
log = "0.4"
# Already built by gpui-component (translations); same version.
rust-i18n = "4.2"

[workspace.lints.clippy]
all = "warn"
unwrap_used = "warn"
expect_used = "warn"

[workspace.lints.rust]
# The one unsafe call Postino needs, the Windows `AttachConsole` of `postino --help` (#136), lives
# in `telaio_app::cli`.
unsafe_code = "forbid"

# Measured on 2026-09-30 (#34): fat LTO gives an 8% smaller binary and slightly lower RSS than
# thin, with no measurable runtime difference, for about 25% more release build time. Panics stay
# as unwind: with abort, a panic in a load test worker thread would close the whole app.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
