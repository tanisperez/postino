[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0-rc.5"
publish = false
license = "Apache-2.0"
authors = ["Estanislao Pérez Nartallo <tanisperez@gmail.com>"]

[workspace.dependencies]
gpui-kit = "0.7.0"
rquickjs = "0.14"
ureq = "3.4"
serde = "1"
serde_json = "1"
thiserror = "2"
anyhow = "1"
lsp-types = "0.97"
uuid = { version = "1.26", features = ["v4"] }
base64 = "0.23"
fastrand = "2"
pretty_assertions = "1.4"
tempfile = "3"
tiny_http = "0.12"
dirs = "7"
dunce = "1"
toml = "0.8"
log = "0.4"
# Already built by gpui-component (translations) and cosmic-text (OS language); same versions.
rust-i18n = "4.2"
sys-locale = "0.3"
# ICU4X 2.3, same family as icu_locale_core and icu_provider already built through url. Number
# formatting with CLDR data (compiled data, only the four UI languages are ever asked for).
icu_decimal = { version = "2.3", features = ["alloc"] }
# Only to build the `Locale` that `icu_decimal` asks for; already in the tree at 2.3.0.
icu_locale_core = "2.3"
# Already built by gpui-base with its default features; only the local clock is used here.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[workspace.lints.clippy]
all = "warn"
unwrap_used = "warn"
expect_used = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"

# Measured on 2026-09-30 (#34): fat LTO gives an 8% smaller binary and slightly lower RSS than
# thin, with no measurable runtime difference, for about 25% more release build time. Panics stay
# as unwind: with abort, a panic in a load test worker thread would close the whole app.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
