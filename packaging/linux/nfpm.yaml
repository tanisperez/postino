# nfpm config for the deb and rpm packages. Driven by package.sh, which sets:
# Content entries use "expand: true" so nfpm expands the variables in src.
#   POSTINO_VERSION  e.g. 0.1.0 or 0.1.0-rc.1 (nfpm maps the pre-release to 0.1.0~rc.1)
#   POSTINO_ARCH     amd64 or arm64 (Go style, nfpm converts it for rpm)
#   POSTINO_BIN      path to the postino binary
#   POSTINO_ROOT     repo root
name: postino
arch: ${POSTINO_ARCH}
platform: linux
version: ${POSTINO_VERSION}
version_schema: semver
section: devel
priority: optional
maintainer: Estanislao Pérez Nartallo <tanisperez@gmail.com>
description: |
  Lightweight native HTTP client.
  Postino is an open source HTTP client written in Rust. Requests are plain local
  files that can be versioned with git. No login, no cloud.
vendor: Postino
homepage: https://postino.tanis.codes
license: Apache-2.0

contents:
  - src: ${POSTINO_BIN}
    dst: /usr/bin/postino
    expand: true
    file_info:
      mode: 0755
  - src: ${POSTINO_ROOT}/packaging/linux/codes.tanis.postino.desktop
    dst: /usr/share/applications/codes.tanis.postino.desktop
    expand: true
    file_info:
      mode: 0644
  - src: ${POSTINO_ROOT}/packaging/linux/codes.tanis.postino.xml
    dst: /usr/share/mime/packages/codes.tanis.postino.xml
    expand: true
    file_info:
      mode: 0644
  - src: ${POSTINO_ROOT}/packaging/icons/postino.svg
    dst: /usr/share/icons/hicolor/scalable/apps/codes.tanis.postino.svg
    expand: true
    file_info:
      mode: 0644
  - src: ${POSTINO_ROOT}/packaging/icons/png/postino-16.png
    dst: /usr/share/icons/hicolor/16x16/apps/codes.tanis.postino.png
    expand: true
    file_info:
      mode: 0644
  - src: ${POSTINO_ROOT}/packaging/icons/png/postino-24.png
    dst: /usr/share/icons/hicolor/24x24/apps/codes.tanis.postino.png
    expand: true
    file_info:
      mode: 0644
  - src: ${POSTINO_ROOT}/packaging/icons/png/postino-32.png
    dst: /usr/share/icons/hicolor/32x32/apps/codes.tanis.postino.png
    expand: true
    file_info:
      mode: 0644
  - src: ${POSTINO_ROOT}/packaging/icons/png/postino-48.png
    dst: /usr/share/icons/hicolor/48x48/apps/codes.tanis.postino.png
    expand: true
    file_info:
      mode: 0644
  - src: ${POSTINO_ROOT}/packaging/icons/png/postino-64.png
    dst: /usr/share/icons/hicolor/64x64/apps/codes.tanis.postino.png
    expand: true
    file_info:
      mode: 0644
  - src: ${POSTINO_ROOT}/packaging/icons/png/postino-128.png
    dst: /usr/share/icons/hicolor/128x128/apps/codes.tanis.postino.png
    expand: true
    file_info:
      mode: 0644
  - src: ${POSTINO_ROOT}/packaging/icons/png/postino-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/codes.tanis.postino.png
    expand: true
    file_info:
      mode: 0644
  - src: ${POSTINO_ROOT}/packaging/icons/png/postino-512.png
    dst: /usr/share/icons/hicolor/512x512/apps/codes.tanis.postino.png
    expand: true
    file_info:
      mode: 0644
  # deb convention: the license under /usr/share/doc/<name>/ (as "copyright"-like file)
  - src: ${POSTINO_ROOT}/LICENSE
    dst: /usr/share/doc/postino/LICENSE
    expand: true
    file_info:
      mode: 0644
    packager: deb
  # rpm convention: /usr/share/licenses/<name>/, flagged as a license file
  - src: ${POSTINO_ROOT}/LICENSE
    dst: /usr/share/licenses/postino/LICENSE
    expand: true
    type: license
    file_info:
      mode: 0644
    packager: rpm

# Runtime libraries the binary links (libxcb, libxkbcommon, libxkbcommon-x11) or loads with
# dlopen (wayland-client, wayland-egl, EGL; the names embedded in the binary). Vulkan is only a
# recommendation: wgpu can use it, but the binary does not name it. Names differ between deb and
# rpm.
depends:
  - libxkbcommon0
  - libxkbcommon-x11-0
  - libxcb1
  - libwayland-client0
  - libwayland-egl1
  - libegl1
recommends:
  - libvulkan1
overrides:
  rpm:
    depends:
      - libxkbcommon
      - libxkbcommon-x11
      - libxcb
      - libwayland-client
      - libwayland-egl
      - libglvnd-egl
    recommends:
      - vulkan-loader
